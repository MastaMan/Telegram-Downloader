name: Windows validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tgzip bootstrap.py tests
      - run: python -m unittest discover -s tests -v
      - run: python -m tgzip --demo --screenshot preview-windows.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ matrix.python }}
          path: preview-windows.png
